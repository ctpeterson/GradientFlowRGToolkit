[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gfrgtoolkit"
version = "0.1.0"
description = "Object-oriented continuous gradient-flow beta-function analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gvar>=13.0",
    "numba>=0.57",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
